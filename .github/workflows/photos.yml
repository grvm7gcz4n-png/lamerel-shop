name: Поиск фото товаров
on:
  push:
    paths:
      - 'tools/photo_request.txt'
permissions:
  contents: write
concurrency:
  group: altegio-sync
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/find_photos.py
      - run: |
          git config user.name "lamerel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/photo_found.json
          git diff --cached --quiet && exit 0
          git commit -m "Найденные фото товаров"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
