name: Удаление пустых карточек клиентов (разовое)
on:
  push:
    paths:
      - 'tools/delete_request.json'
permissions:
  contents: write
concurrency:
  group: altegio-delete
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Удалить
        env:
          ALTEGIO_PARTNER_TOKEN: ${{ secrets.ALTEGIO_PARTNER_TOKEN }}
          ALTEGIO_LOGIN: ${{ secrets.ALTEGIO_LOGIN }}
          ALTEGIO_PASSWORD: ${{ secrets.ALTEGIO_PASSWORD }}
        run: python tools/delete_clients.py
      - name: Отчёт
        if: always()
        run: |
          git config user.name "lamerel-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f tools/delete_report.json ] && git add tools/delete_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Отчёт об удалении карточек"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 7; done
